<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Displey-uzz — Telefon displeylari do'koni</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #ef4444;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
    }
    header {
      background: #ffffff;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 40;
      border-bottom: 1px solid var(--border);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-retail {
      background: #eff6ff;
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      border: 1px solid #bfdbfe;
    }
    .search-box {
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background: #f1f5f9;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      background: #ffffff;
      border-color: var(--primary);
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }
    .banners-container {
      padding: 12px 16px 4px;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .banners-container::-webkit-scrollbar {
      display: none;
    }
    .banner-card {
      min-width: 280px;
      padding: 14px 16px;
      border-radius: 14px;
      color: white;
      flex-shrink: 0;
    }
    .banner-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.25);
      margin-bottom: 6px;
    }
    .banner-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .banner-desc {
      font-size: 12px;
      opacity: 0.9;
    }
    .categories {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar {
      display: none;
    }
    .cat-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #ffffff;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 8px 16px 20px;
    }
    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .p-brand {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .p-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin: 4px 0 6px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 34px;
    }
    .p-type {
      font-size: 11px;
      color: var(--text-muted);
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      align-self: flex-start;
      margin-bottom: 8px;
    }
    .p-stock {
      font-size: 11px;
      color: var(--success);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .p-price-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .p-price {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
    }
    .btn-add {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-add:active {
      background: var(--primary-hover);
    }
    .qty-counter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--primary);
      border-radius: 8px;
      background: #eff6ff;
      height: 34px;
      overflow: hidden;
    }
    .qty-btn {
      width: 32px;
      height: 100%;
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .qty-val {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
    }
    .cart-bar {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: var(--primary);
      color: white;
      padding: 12px 18px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
      cursor: pointer;
      z-index: 50;
      transition: transform 0.2s;
    }
    .cart-bar:active {
      transform: scale(0.98);
    }
    .cart-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cart-badge {
      background: white;
      color: var(--primary);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
    }
    .cart-total {
      font-size: 15px;
      font-weight: 700;
    }
    .cart-btn-text {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      z-index: 100;
      display: none;
      backdrop-filter: blur(2px);
    }
    .modal-content {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-radius: 20px 20px 0 0;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px 16px 24px;
      z-index: 101;
      display: none;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 800;
    }
    .modal-close {
      border: none;
      background: #f1f5f9;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .ci-info {
      flex: 1;
      padding-right: 10px;
    }
    .ci-name {
      font-size: 13px;
      font-weight: 700;
    }
    .ci-price {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .form-group {
      margin-top: 14px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--primary);
    }
    .delivery-options {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .deliv-btn {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .deliv-btn.active {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--primary);
    }
    .summary-box {
      margin: 16px 0;
      background: #f8fafc;
      padding: 12px;
      border-radius: 10px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--text-muted);
    }
    .summary-row.total {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      border-top: 1px dashed var(--border);
      padding-top: 8px;
      margin-top: 8px;
    }
    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .btn-submit:active {
      background: var(--primary-hover);
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="brand-title">
        📱 Displey-uzz
        <span class="badge-retail">Dona savdo</span>
      </div>
      <div style="font-size: 12px; color: var(--text-muted); font-weight: 600;">
        🛡 2 oy kafolat
      </div>
    </div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Modelni qidiring (masalan: A12, Note 10)..." oninput="handleSearch()">
    </div>
  </header>

  <div class="banners-container" id="bannersList"></div>
  <div class="categories" id="categoryList"></div>
  <div class="products-grid" id="productsGrid"></div>

  <div class="cart-bar" id="cartBar" style="display: none;" onclick="openCartModal()">
    <div class="cart-left">
      <div class="cart-badge" id="cartCount">0</div>
      <div class="cart-total" id="cartSum">0 so'm</div>
    </div>
    <div class="cart-btn-text">
      Buyurtma berish ➔
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeCartModal()"></div>
  <div class="modal-content" id="cartModal">
    <div class="modal-header">
      <div class="modal-title">🛒 Savatingiz</div>
      <button class="modal-close" onclick="closeCartModal()">✕</button>
    </div>

    <div id="cartItemsList"></div>

    <div class="summary-box">
      <div class="summary-row">
        <span>Tovarlar soni:</span>
        <span id="sumQty">0 dona</span>
      </div>
      <div class="summary-row total">
        <span>Jami summa:</span>
        <span id="sumPrice">0 so'm</span>
      </div>
    </div>

    <div class="form-group">
      <label>Ismingiz</label>
      <input type="text" id="cust-name" placeholder="Masalan: Mansurbek">
    </div>

    <div class="form-group">
      <label>Telefon raqamingiz</label>
      <input type="tel" id="cust-phone" placeholder="+998901234567" value="+998">
    </div>

    <div class="form-group">
      <label>Yetkazib berish usuli</label>
      <div class="delivery-options">
        <div class="deliv-btn active" id="btnDelivTaxi" onclick="selectDelivery('Taksi')">🚕 Taksi / Dastavka</div>
        <div class="deliv-btn" id="btnDelivBts" onclick="selectDelivery('BTS Pochta')">📦 BTS Pochta</div>
      </div>
    </div>

    <div class="form-group">
      <label>Manzilingiz / Shahar yoki viloyat</label>
      <input type="text" id="cust-addr" placeholder="Shahar, tuman yoki pochta bo'limi nomi">
    </div>

    <button class="btn-submit" onclick="submitOrder()">
      ✅ Buyurtmani tasdiqlash
    </button>
  </div>

  <script src="data.js"></script>

  <script>
    let selectedBrand = "Barchasi";
    let searchQuery = "";
    let cart = [];
    let selectedDelivery = "Taksi";

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try {
        if (tg.initDataUnsafe?.user?.first_name) {
          const userName = tg.initDataUnsafe.user.first_name;
          const nameInput = document.getElementById("cust-name");
          if (nameInput && !nameInput.value) nameInput.value = userName;
        }
      } catch (e) {}
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderBanners();
      renderCategories();
      renderProducts();
    });

    function renderBanners() {
      const container = document.getElementById("bannersList");
      if (!container || typeof bannersData === "undefined") return;
      container.innerHTML = bannersData.map(b => `
        <div class="banner-card" style="background: ${b.bg};">
          <span class="banner-badge">${b.badge}</span>
          <div class="banner-title">${b.title}</div>
          <div class="banner-desc">${b.desc}</div>
        </div>
      `).join("");
    }

    function renderCategories() {
      const catList = document.getElementById("categoryList");
      if (!catList || typeof productsData === "undefined") return;
      
      const brands = ["Barchasi", ...new Set(productsData.map(p => p.brand).filter(Boolean))];
      catList.innerHTML = brands.map(b => `
        <button class="cat-btn ${b === selectedBrand ? 'active' : ''}" onclick="selectCategory('${b}')">
          ${b}
        </button>
      `).join("");
    }

    function selectCategory(brand) {
      selectedBrand = brand;
      renderCategories();
      renderProducts();
    }

    function handleSearch() {
      searchQuery = document.getElementById("searchInput").value.trim().toLowerCase();
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      if (!grid || typeof productsData === "undefined") return;

      const filtered = productsData.filter(p => {
        const matchBrand = (selectedBrand === "Barchasi" || p.brand === selectedBrand);
        const matchSearch = (!searchQuery || 
          p.name.toLowerCase().includes(searchQuery) || 
          p.brand.toLowerCase().includes(searchQuery) ||
          p.type.toLowerCase().includes(searchQuery)
        );
        return matchBrand && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">Hech qanday displey topilmadi.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const inCart = cart.find(item => item.id === p.id);
        const cartQty = inCart ? inCart.qty : 0;

        return `
          <div class="product-card">
            <div>
              <div class="p-brand">${p.brand}</div>
              <div class="p-name">${p.name}</div>
              <div class="p-type">${p.type}</div>
              <div class="p-stock">Omborda: ${p.stock} dona</div>
            </div>
            <div>
              <div class="p-price-row">
                <span class="p-price">${Number(p.retail).toLocaleString("uz-UZ")} so'm</span>
              </div>
              ${cartQty > 0 ? `
                <div class="qty-counter">
                  <button class="qty-btn" onclick="updateQty(${p.id}, -1)">−</button>
                  <span class="qty-val">${cartQty}</span>
                  <button class="qty-btn" onclick="updateQty(${p.id}, 1)">+</button>
                </div>
              ` : `
                <button class="btn-add" onclick="addToCart(${p.id})">
                  Savatga qo'shish
                </button>
              `}
            </div>
          </div>
        `;
      }).join("");
    }

    function addToCart(id) {
      const product = productsData.find(p => p.id === id);
      if (!product) return;
      cart.push({
        id: product.id,
        name: product.name,
        brand: product.brand,
        type: product.type,
        price: product.retail,
        qty: 1
      });
      updateCartUI();
    }

    function updateQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(i => i.id !== id);
      }
      updateCartUI();
    }

    function updateCartUI() {
      renderProducts();
      const totalQty = cart.reduce((sum, i) => sum + i.qty, 0);
      const totalSum = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

      const cartBar = document.getElementById("cartBar");
      if (totalQty > 0) {
        cartBar.style.display = "flex";
        document.getElementById("cartCount").textContent = totalQty;
        document.getElementById("cartSum").textContent = totalSum.toLocaleString("uz-UZ") + " so'm";
      } else {
        cartBar.style.display = "none";
        closeCartModal();
      }

      renderCartModalItems();
    }

    function openCartModal() {
      if (cart.length === 0) return;
      document.getElementById("modalOverlay").style.display = "block";
      document.getElementById("cartModal").style.display = "block";
      renderCartModalItems();
    }

    function closeCartModal() {
      document.getElementById("modalOverlay").style.display = "none";
      document.getElementById("cartModal").style.display = "none";
    }

    function renderCartModalItems() {
      const container = document.getElementById("cartItemsList");
      if (!container) return;

      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="ci-info">
            <div class="ci-name">${item.name} (${item.type})</div>
            <div class="ci-price">${Number(item.price).toLocaleString("uz-UZ")} so'm x ${item.qty}</div>
          </div>
          <div class="qty-counter" style="height: 30px;">
            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">−</button>
            <span class="qty-val">${item.qty}</span>
            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
          </div>
        </div>
      `).join("");

      const totalQty = cart.reduce((sum, i) => sum + i.qty, 0);
      const totalSum = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      document.getElementById("sumQty").textContent = totalQty + " dona";
      document.getElementById("sumPrice").textContent = totalSum.toLocaleString("uz-UZ") + " so'm";
    }

    function selectDelivery(type) {
      selectedDelivery = type;
      document.getElementById("btnDelivTaxi").classList.toggle("active", type === "Taksi");
      document.getElementById("btnDelivBts").classList.toggle("active", type === "BTS Pochta");
    }

    async function submitOrder() {
      const name = document.getElementById("cust-name")?.value.trim();
      const phone = document.getElementById("cust-phone")?.value.trim();
      const addr = document.getElementById("cust-addr")?.value.trim();

      if (!name) {
        alert("Iltimos, ismingizni kiriting!");
        return;
      }
      if (!phone || phone.length < 9) {
        alert("Iltimos, to'liq telefon raqamingizni kiriting!");
        return;
      }
      if (!addr) {
        alert("Iltimos, yetkazib berish manzilini kiriting!");
        return;
      }
      if (cart.length === 0) {
        alert("Savatingiz bo'sh!");
        return;
      }

      const btn = document.querySelector(".btn-submit");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "⏳ Buyurtma yuborilmoqda...";
      }

      const totalQty = cart.reduce((sum, i) => sum + i.qty, 0);
      const totalSum = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

      const tgApp = window.Telegram?.WebApp;
      const cid = tgApp?.initDataUnsafe?.user?.id || null;
      const tgName = tgApp?.initDataUnsafe?.user?.first_name || name;
      const tgUsername = tgApp?.initDataUnsafe?.user?.username || "";

      const orderPayload = {
        cid: cid,
        tg_name: tgName,
        username: tgUsername,
        name: name,
        phone: phone,
        delivery: selectedDelivery,
        address: addr,
        items: cart,
        total_qty: totalQty,
        total_sum: totalSum
      };

      try {
        const response = await fetch("/api/order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(orderPayload)
        });

        const result = await response.json();

        if (result.status === "ok") {
          alert("✅ Buyurtmangiz qabul qilindi!");
          cart = [];
          updateCartUI();
          closeCartModal();
          if (tgApp && typeof tgApp.close === "function") {
            tgApp.close();
          }
        } else {
          alert("Xatolik: " + (result.message || "Buyurtma yuborilmadi"));
          if (btn) {
            btn.disabled = false;
            btn.textContent = "✅ Buyurtmani tasdiqlash";
          }
        }
      } catch (err) {
        alert("Tarmoq xatoligi: " + err.message);
        if (btn) {
          btn.disabled = false;
          btn.textContent = "✅ Buyurtmani tasdiqlash";
        }
      }
    }
  </script>
</body>
</html>
